<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - PULSO DIGITAL</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <div id="pagePulsoDigital">

        <!-- ====== Header ====== -->
        <div id="hedePulsoDigital" class="fixed-header">
            <header id="heder">
                <div class="wrapper">
                    <div id="site-logo">
                        <a href="index.html" title="pulso">
                            <img src="imagenes/encabezado.jpg" alt="logo pulso">
                        </a>
                    </div>
                    <span id="fecha-actual" class="fecha-header"></span>
                    <nav class="nav-links">
                        <ul class="d-flex">
                            <li class="link-header"><a href="index.html">Inicio</a></li>
                            <li class="link-header"><a href="tecnologia.html">Tecnología</a></li>
                            <li class="link-header"><a href="politica.html">Política</a></li>
                            <li class="link-header"><a href="deportes.html">Deportes</a></li>
                            <li class="link-header"><a href="contacto.html">Contacto</a></li>
                        </ul>
                    </nav>
                </div>
            </header>
        </div>

    </div>

    <!-- ====== Sección de Contacto Centrada ====== -->
    <main style="display: block; width: 100%; min-height: 80vh; padding-top: 130px; padding-bottom: 70px; background-color: #121212;">
        
        <div style="max-width: 600px; margin: 0 auto; padding: 0 20px; box-sizing: border-box;">
            
            <h2 class="centrar-texto" style="margin-top: 0; margin-bottom: 12px; font-size: 3.5rem;">Contáctanos</h2>
            <p style="text-align: center; color: #cccccc; font-size: 1.6rem; margin-bottom: 28px; line-height: 1.5;">
                ¿Tienes alguna consulta, sugerencia o noticia para compartir? Escríbenos.
            </p>

            <form id="formContacto" novalidate style="display: block; width: 100%; background-color: #1a1a1a; padding: 35px 30px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.6); border: 1px solid #333333; box-sizing: border-box;">
                
                <div style="margin-bottom: 22px; width: 100%;">
                    <label for="nombre" style="display: block; font-size: 1.5rem; font-weight: bold; margin-bottom: 8px; color: #ffffff;">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre y apellido" style="width: 100%; height: 46px; padding: 0 14px; background-color: #262626; border: 1px solid #444444; border-radius: 6px; color: #ffffff; font-size: 1.5rem; box-sizing: border-box; display: block;">
                    <span id="errorNombre" style="color: #ff6b6b; font-size: 1.3rem; display: block; margin-top: 6px;"></span>
                </div>

                <div style="margin-bottom: 22px; width: 100%;">
                    <label for="correo" style="display: block; font-size: 1.5rem; font-weight: bold; margin-bottom: 8px; color: #ffffff;">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" style="width: 100%; height: 46px; padding: 0 14px; background-color: #262626; border: 1px solid #444444; border-radius: 6px; color: #ffffff; font-size: 1.5rem; box-sizing: border-box; display: block;">
                    <span id="errorCorreo" style="color: #ff6b6b; font-size: 1.3rem; display: block; margin-top: 6px;"></span>
                </div>

                <div style="margin-bottom: 26px; width: 100%;">
                    <label for="mensaje" style="display: block; font-size: 1.5rem; font-weight: bold; margin-bottom: 8px; color: #ffffff;">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí..." style="width: 100%; padding: 12px 14px; background-color: #262626; border: 1px solid #444444; border-radius: 6px; color: #ffffff; font-size: 1.5rem; box-sizing: border-box; display: block; resize: vertical;"></textarea>
                    <span id="errorMensaje" style="color: #ff6b6b; font-size: 1.3rem; display: block; margin-top: 6px;"></span>
                </div>

                <button type="submit" id="btnEnviar" style="width: 100%; height: 50px; background-color: #e5a93b; color: #000000; border: none; border-radius: 6px; font-size: 1.7rem; font-weight: bold; cursor: pointer; display: block; transition: 0.2s;">
                    Enviar mensaje
                </button>
            </form>

            <!-- Mensaje de confirmación -->
            <div id="mensajeExito" style="display: none; margin-top: 20px; padding: 16px; background-color: #1e4620; color: #d4edda; border-radius: 8px; border: 1px solid #28a745; text-align: center; font-size: 1.5rem; font-weight: 500; box-sizing: border-box;">
                ✅ ¡Gracias por comunicarte con Pulso Digital! Tu mensaje ha sido enviado correctamente.
            </div>

        </div>

    </main>

    <!-- ====== Footer ====== --> 
    <div id="FooterPuntoDigital" class="footer-basic">
        <footer>
            <div class="social">
                <a href="#"><i class="icon icon-color ion-social-github"></i></a>
                <a href="#"><i class="icon icon-color ion-social-whatsapp"></i></a>
                <a href="#"><i class="icon icon-color ion-social-facebook"></i></a>
                <a href="#"><i class="icon icon-color ion-social-instagram"></i></a>
            </div>
            <p class="copyright">Pulso Digital ©2026</p>
        </footer>
    </div>

</body>
</html>
